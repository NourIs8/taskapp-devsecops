<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TaskApp</title>
<style>
  body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; padding: 2rem; color: #222; }
  main { max-width: 560px; margin: auto; background: #fff; padding: 1.5rem; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
  h1 { margin-top: 0; }
  form { display: flex; gap: .5rem; margin-bottom: 1rem; }
  input { flex: 1; padding: .6rem; border: 1px solid #bbb; border-radius: 6px; }
  button { padding: .6rem .9rem; border: 0; border-radius: 6px; cursor: pointer; background: #1565c0; color: #fff; }
  button.ok { background: #2e7d32; }
  button.del { background: #c62828; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { display: flex; align-items: center; gap: .5rem; padding: .6rem 0; border-bottom: 1px solid #eee; }
  li span { flex: 1; }
  li.done span { text-decoration: line-through; color: #888; }
  #msg { color: #c62828; min-height: 1.2rem; }
</style>
</head>
<body>
<main>
  <h1>TaskApp</h1>
  <form id="form">
    <input id="title" placeholder="Nouvelle tache" required maxlength="100">
    <button type="submit">Ajouter</button>
  </form>
  <p id="msg"></p>
  <ul id="list"></ul>
</main>
<script>
  const API = '/api/tasks';
  const FIELD = 'title';
  const list = document.getElementById('list');
  const msg = document.getElementById('msg');

  function showError(text) { msg.textContent = text; }

  async function load() {
    try {
      const r = await fetch(API);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      render(await r.json());
      showError('');
    } catch (e) {
      showError('Erreur de chargement : ' + e.message);
    }
  }

  function makeButton(label, cls, handler) {
    const b = document.createElement('button');
    b.className = cls;
    b.textContent = label;
    b.addEventListener('click', handler);
    return b;
  }

  function render(tasks) {
    list.replaceChildren();
    tasks.forEach(function (t) {
      const li = document.createElement('li');
      const isDone = t.done === true || t.completed === true;
      if (isDone) li.className = 'done';
      const span = document.createElement('span');
      span.textContent = t[FIELD] || t.title || t.name || t.description || '(sans titre)';
      li.appendChild(span);
      if (!isDone) {
        li.appendChild(makeButton('Terminer', 'ok', function () { act('PUT', t.id + '/done'); }));
      }
      li.appendChild(makeButton('Supprimer', 'del', function () { act('DELETE', String(t.id)); }));
      list.appendChild(li);
    });
  }

  async function act(method, path) {
    try {
      const r = await fetch(API + '/' + path, { method: method });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      await load();
    } catch (e) {
      showError('Erreur : ' + e.message);
    }
  }

  document.getElementById('form').addEventListener('submit', async function (e) {
    e.preventDefault();
    const input = document.getElementById('title');
    const body = {};
    body[FIELD] = input.value.trim();
    try {
      const r = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      input.value = '';
      await load();
    } catch (err) {
      showError('Erreur : ' + err.message);
    }
  });

  load();
</script>
</body>
</html>
